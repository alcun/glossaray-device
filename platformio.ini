; Glossaray — Waveshare ESP32-S3-Touch-AMOLED-1.8 V2 (SKU 29957)
[env:glossaray]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/inject_device_token.py

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

lib_deps =
    moononournation/GFX Library for Arduino@1.6.5
    lewisxhe/XPowersLib@0.3.3
    tzapu/WiFiManager@2.0.17
    gilmaimon/ArduinoWebsockets@0.5.4
    bblanchon/ArduinoJson@7.4.2
    olikraus/U8g2@2.36.18

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DU8G2_USE_LARGE_FONTS
